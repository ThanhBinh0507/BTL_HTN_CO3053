apiVersion: 1

datasources:
  - name: InfluxDB_Flux
    uid: InfluxDB_Flux
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    isDefault: true
    jsonData:
      version: Flux
      organization: HCMUT
      defaultBucket: smart_school_data
      tlsSkipVerify: true
    secureJsonData:
      token: my-super-secret-admin-token
    editable: true
