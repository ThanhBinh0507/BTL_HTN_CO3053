# Mosquitto MQTT Broker Configuration for Smart Virtual School

# Listen on port 1883 for standard MQTT
listener 1883
allow_anonymous true

# Listen on port 9001 for WebSockets (useful for web-based MQTT clients)
listener 9001
protocol websockets
allow_anonymous true

# Data persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

